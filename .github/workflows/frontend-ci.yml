name: Frontend CI

permissions:
  contents: read

on:
  push:
    branches:
      - master
      - main
  pull_request:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Audit, checks and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: https://figurzilla.ru/internal-api/v1
      CLIENT_API_BASE_URL: https://figurzilla.ru/internal-api/v1
      API_BASE_URL: https://figurzilla.ru/internal-api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Architecture check
        run: npm run architecture:check

      - name: Build
        run: npm run build

      - name: Package standalone build
        run: tar -czf standalone-build.tar.gz .next/standalone .next/static public

      - name: Upload standalone build
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: standalone-build.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION="$(node -p "require('./package.json').version")" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --build-arg CLIENT_API_BASE_URL="$CLIENT_API_BASE_URL" \
            --build-arg API_BASE_URL="$API_BASE_URL" \
            -t figurzilla-frontend:ci .

  e2e:
    name: E2E shard ${{ matrix.shard }}/4
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_PORT: 3010
      PLAYWRIGHT_FIXTURE_API_PORT: 3011
      CLIENT_API_BASE_URL: http://127.0.0.1:9
      ALLOW_LOCAL_API_URL: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download standalone build
        uses: actions/download-artifact@v8
        with:
          name: standalone-build

      - name: Extract standalone build
        run: tar -xzf standalone-build.tar.gz

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Standalone smoke and E2E shard
        run: npm run test:standalone -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  ci-result:
    # Preserve the previous aggregate check name for branch protection rules.
    name: Typecheck, lint, build
    if: always()
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require checks and every E2E shard
        run: |
          test "${{ needs.checks.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
