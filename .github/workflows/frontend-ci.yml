name: Frontend CI

permissions:
  contents: read

on:
  push:
    branches:
      - master
      - main
  pull_request:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: https://figurzilla.ru/internal-api/v1
      CLIENT_API_BASE_URL: https://figurzilla.ru/internal-api/v1
      API_BASE_URL: https://figurzilla.ru/internal-api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Architecture check
        run: npm run architecture:check

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --build-arg CLIENT_API_BASE_URL="$CLIENT_API_BASE_URL" \
            --build-arg API_BASE_URL="$API_BASE_URL" \
            -t figurzilla-frontend:ci .

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config
